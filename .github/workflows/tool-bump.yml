name: CI tool pin watch

# Self-healing pin hygiene, part 2 (#228, #373): the CI tools installed by curl-with-checksum, pipx
# or a docker digest are the pins Dependabot can't see. Weekly, compare each against its latest
# upstream release and keep ONE tracking issue up to date.
#
# It REPORTS and never bumps (#376). It used to open a bot PR per stale pin, with the dispatched
# checks on the branch as the verification — a genuinely better design, and it had never once
# worked: seven of the nine pins live in `.github/workflows/**`, and GITHUB_TOKEN may not push
# changes to a workflow file. There is no `permissions:` key that grants it; the `workflow` scope
# exists only for a PAT or GitHub App. Every run went green on having found nothing to do, which
# from the outside is indistinguishable from a watcher that works. Buying the PR flow back would
# mean a long-lived token that can rewrite this repo's CI, which is a poor trade for a repo whose
# whole posture is SHA-pinned actions and least-privilege tokens.
#
# XMRig keeps its PR flow in xmrig-bump.yml: it lives in rigforge.sh, so that push is not blocked,
# and a build-verified bump is worth having for the one pin that ships to a rig.
#
# Watched here: shellcheck, shfmt, gitleaks, actionlint, lychee, jq, zizmor, diff-cover, kcov.
# Elsewhere: XMRig by xmrig-bump.yml, GitHub Actions and .pre-commit-config.yaml by Dependabot.
# That is every pin in the repo. If you add one, add it to one of those three places in the same
# change.
on:
  schedule:
    - cron: "30 6 * * 1" # Mondays 06:30 UTC, between the xmrig bump and the zizmor re-audit
  workflow_dispatch:

permissions:
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # the report is the job's one output — it never pushes or publishes
    env:
      GH_TOKEN: ${{ github.token }}
      TITLE: "CI tool pin currency (weekly report)"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # zizmor: artipacked
      - name: Compare every pinned tool against its latest upstream release
        id: report
        run: |
          set -uo pipefail
          failed=0
          rows=""

          # <name> <upstream-repo> <current> [tag-prefix]
          #
          # Not every project tags `vX.Y.Z`: lychee tags `lychee-v0.24.2` and jq tags `jq-1.8.2`.
          # Stripping only a leading "v" leaves those failing the shape check, which would report
          # two healthy pins as broken every week — and a watcher that cries wolf weekly gets muted,
          # which is exactly as useful as one that never runs. The prefix is a per-tool fact, so it
          # is a per-tool argument. The strict validation still runs AFTER the strip: normalising
          # the spelling must not mean trusting the value.
          #
          # UNREACHABLE IS NOT CURRENT. A failed lookup or an unparseable tag is counted, named in
          # the report, and fails the run — it never quietly reads as "pin is current".
          check() {
            local name="$1" repo="$2" current="$3" prefix="${4:-v}" latest
            if ! latest=$(gh api "repos/${repo}/releases/latest" --jq .tag_name 2>/dev/null); then
              rows="${rows}| ${name} | \`${current}\` | — | **upstream lookup FAILED — not checked** |"$'\n'
              failed=$((failed + 1))
              return
            fi
            latest="${latest#"$prefix"}"
            if ! printf '%s' "$latest" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
              rows="${rows}| ${name} | \`${current}\` | — | **upstream tag unparseable — not checked** |"$'\n'
              failed=$((failed + 1))
              return
            fi
            if [ "$latest" = "$current" ]; then
              rows="${rows}| ${name} | \`${current}\` | \`${latest}\` | current |"$'\n'
            else
              rows="${rows}| ${name} | \`${current}\` | \`${latest}\` | **stale** |"$'\n'
            fi
          }

          # Each `cur` is read from the tree, never from a second list.
          check shellcheck koalaman/shellcheck \
            "$(grep -oE 'SHELLCHECK_VERSION: "[0-9.]+"' .github/workflows/ci.yml | grep -oE '[0-9.]+')"
          check shfmt mvdan/sh \
            "$(grep -oE 'SHFMT_VERSION: "[0-9.]+"' .github/workflows/ci.yml | grep -oE '[0-9.]+')"
          check actionlint rhysd/actionlint \
            "$(grep -oE 'ACTIONLINT_VERSION: "[0-9.]+"' .github/workflows/ci.yml | grep -oE '[0-9.]+')"
          check diff-cover Bachmann1234/diff_cover \
            "$(grep -oE 'DIFF_COVER_VERSION: "[0-9.]+"' .github/workflows/ci.yml | grep -oE '[0-9.]+')"
          check gitleaks gitleaks/gitleaks \
            "$(grep -oE 'GITLEAKS_VERSION: "[0-9.]+"' .github/workflows/security.yml | grep -oE '[0-9.]+')"
          check zizmor zizmorcore/zizmor \
            "$(grep -oE 'ZIZMOR_VERSION: "[0-9.]+"' .github/workflows/security.yml | grep -oE '[0-9.]+')"
          check lychee lycheeverse/lychee \
            "$(grep -oE 'LYCHEE_VERSION: "[0-9.]+"' .github/workflows/links.yml | grep -oE '[0-9.]+')" "lychee-v"
          check jq jqlang/jq \
            "$(grep -oE 'download/jq-[0-9.]+' tests/coverage.sh | grep -oE '[0-9]+(\.[0-9]+)*')" "jq-"

          # kcov is a Docker Hub image, not a GitHub release — the one second source type, and so the
          # one place a failure looks different. An unreachable Docker Hub must not read as current.
          kcur=$(grep -oE '# kcov v[0-9]+' tests/coverage.sh | grep -oE '[0-9]+')
          if klatest=$(curl -fsS --max-time 30 "https://hub.docker.com/v2/repositories/kcov/kcov/tags?page_size=100" 2>/dev/null |
            jq -r '.results[].name' | grep -E '^v[0-9]+$' | sort -V | tail -1) && [ -n "$klatest" ]; then
            if [ "v${kcur}" = "$klatest" ]; then
              rows="${rows}| kcov (image) | \`v${kcur}\` | \`${klatest}\` | current |"$'\n'
            else
              rows="${rows}| kcov (image) | \`v${kcur}\` | \`${klatest}\` | **stale** |"$'\n'
            fi
          else
            rows="${rows}| kcov (image) | \`v${kcur}\` | — | **Docker Hub lookup FAILED — not checked** |"$'\n'
            failed=$((failed + 1))
          fi

          {
            printf '%s\n\n' "Weekly currency check of the CI tool pins Dependabot cannot see (\`.github/workflows/tool-bump.yml\`). This never bumps anything — bump a stale pin by hand and let its own check verify it."
            printf '| tool | pinned | upstream latest | |\n|---|---|---|---|\n%s\n' "$rows"
            printf '%s\n' "Watched elsewhere: **XMRig** by \`xmrig-bump.yml\` (it still opens a build-verified PR), **GitHub Actions** and **.pre-commit-config.yaml** by Dependabot."
            if [ "$failed" -gt 0 ]; then
              printf '\n%s\n' "**${failed} lookup(s) could not run — those rows are UNCHECKED, not current.**"
            else
              printf '\n%s\n' "_Last fully successful check: $(date -u '+%Y-%m-%d %H:%M UTC')_"
            fi
          } >report.md
          cat report.md
          echo "rc=$failed" >>"$GITHUB_OUTPUT"
      - name: Publish it to the one tracking issue
        run: |
          set -Eeuo pipefail
          body=$(cat report.md)
          # Exact title match over the open list, NOT `--search`: the search index lags behind issue
          # creation by minutes, so a search-based dedup files a second issue on the very next run.
          n=$(gh issue list --state open --limit 200 --json number,title \
            --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          # A run that could not do its job replaces the report with failure rows, taking the
          # "last fully successful check" date with it — and that date is the only thing separating
          # "failed once this morning" from "has been dead for six weeks". Carry it forward.
          if [ "${{ steps.report.outputs.rc }}" != "0" ] && [ -n "$n" ]; then
            prev=$(gh issue view "$n" --json body --jq .body | grep -a '^_Last fully successful check:' || true)
            if [ -n "$prev" ]; then
              body="$body"$'\n\n'"$prev (this run could not complete)"
            fi
          fi
          if [ -n "$n" ]; then
            gh issue edit "$n" --body "$body"
            echo "updated #$n"
          else
            gh issue create --title "$TITLE" --label infra --body "$body"
          fi
      - name: Fail the run if any lookup could not be made
        if: steps.report.outputs.rc != '0'
        run: |
          echo "::error::one or more upstream lookups could not run — those pins are UNCHECKED, not current"
          exit 1
