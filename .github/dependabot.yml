version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    labels:
      - "infra"
      - "dependencies"
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
      - "dependencies"
  - package-ecosystem: "pip"
    directory: "/tools"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
      - "dependencies"
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
      - "dependencies"
  - package-ecosystem: "docker"
    directories:
      - "/tests/e2e"
      - "/tests/coverage"
      - "/tests/docker"
    schedule:
      interval: "weekly"
    labels:
      - "infra"
      - "dependencies"
